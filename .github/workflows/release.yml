name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN_VERSION="${TAG#v}"
          CHANGELOG_VERSION="$CLEAN_VERSION" python3 << 'PYEOF' > /tmp/release_notes.txt
          import re, os
          version = os.environ['CHANGELOG_VERSION']
          with open('CHANGELOG.md') as f:
              content = f.read()
          m = re.search(r'## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)', content, re.DOTALL)
          notes = m.group(1).strip() if m else 'Bug fixes and improvements.'
          print(notes, end='')
          PYEOF
          gh release view "$TAG" 2>/dev/null || \
          gh release create "$TAG" \
            --title "Trade Journal $TAG" \
            --notes-file /tmp/release_notes.txt

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # ── macOS: create updater bundle, sign, upload assets + save sig ──────────

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(node -e "const c=require('./src-tauri/tauri.conf.json');console.log(c.version)")
          BUNDLE_MACOS="src-tauri/target/release/bundle/macos"
          BUNDLE_DMG="src-tauri/target/release/bundle/dmg"

          # tauri build only produces .app and .dmg — create updater tar.gz + sign manually
          tar -czf "$BUNDLE_MACOS/Trade Journal.app.tar.gz" \
            -C "$BUNDLE_MACOS" "Trade Journal.app"
          npx tauri signer sign "$BUNDLE_MACOS/Trade Journal.app.tar.gz"

          # Copy to /tmp with no spaces in filenames (gh CLI chokes on spaces in globs)
          mkdir -p /tmp/release
          cp "$BUNDLE_DMG/Trade Journal_${VERSION}_aarch64.dmg" \
            "/tmp/release/Trade.Journal_${VERSION}_aarch64.dmg"
          cp "$BUNDLE_MACOS/Trade Journal.app.tar.gz" \
            "/tmp/release/Trade.Journal_aarch64.app.tar.gz"
          cp "$BUNDLE_MACOS/Trade Journal.app.tar.gz.sig" \
            "/tmp/release/Trade.Journal_aarch64.app.tar.gz.sig"

          gh release upload "$TAG" "/tmp/release/Trade.Journal_${VERSION}_aarch64.dmg" --clobber
          gh release upload "$TAG" "/tmp/release/Trade.Journal_aarch64.app.tar.gz" --clobber

      - name: Save macOS sig artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-sig
          path: /tmp/release/Trade.Journal_aarch64.app.tar.gz.sig

      # ── Windows: zip + sign NSIS installer, upload assets + save sig ─────────

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(node -e "const c=require('./src-tauri/tauri.conf.json');console.log(c.version)")

          # Use RUNNER_TEMP — a real Windows path both bash and Python agree on
          OUTDIR="$RUNNER_TEMP/release"
          mkdir -p "$OUTDIR"

          # Zip the NSIS installer using Python (avoids path+space issues with 7z)
          python3 -c "
          import zipfile, os
          outdir = os.environ['RUNNER_TEMP'].replace(chr(92), '/') + '/release'
          os.makedirs(outdir, exist_ok=True)
          exe = 'src-tauri/target/release/bundle/nsis/Trade Journal_${VERSION}_x64-setup.exe'
          out = outdir + '/Trade.Journal_${VERSION}_x64-setup.nsis.zip'
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_STORED) as zf:
              zf.write(exe, os.path.basename(exe))
          print('Created', out)
          "

          NSIS_ZIP="$OUTDIR/Trade.Journal_${VERSION}_x64-setup.nsis.zip"

          # Sign the zip (reads TAURI_SIGNING_PRIVATE_KEY + PASSWORD from env automatically)
          npx tauri signer sign "$NSIS_ZIP"

          # Copy sig to a fixed filename so the finalize job can find it without knowing VERSION
          cp "${NSIS_ZIP}.sig" "$OUTDIR/windows.nsis.zip.sig"

          cp "src-tauri/target/release/bundle/nsis/Trade Journal_${VERSION}_x64-setup.exe" \
            "$OUTDIR/Trade.Journal_${VERSION}_x64-setup.exe"
          cp "src-tauri/target/release/bundle/msi/Trade Journal_${VERSION}_x64_en-US.msi" \
            "$OUTDIR/Trade.Journal_${VERSION}_x64_en-US.msi"

          gh release upload "$TAG" "$OUTDIR/Trade.Journal_${VERSION}_x64-setup.exe" --clobber
          gh release upload "$TAG" "$OUTDIR/Trade.Journal_${VERSION}_x64_en-US.msi" --clobber
          gh release upload "$TAG" "$NSIS_ZIP" --clobber

      - name: Save Windows sig artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-sig
          path: ${{ runner.temp }}/release/windows.nsis.zip.sig

  # ── Finalize: generate combined latest.json after both platforms complete ────

  finalize:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS sig
        uses: actions/download-artifact@v4
        with:
          name: macos-sig
          path: /tmp/sigs

      - name: Download Windows sig
        uses: actions/download-artifact@v4
        with:
          name: windows-sig
          path: /tmp/sigs

      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os, re
          from datetime import datetime, timezone

          with open('src-tauri/tauri.conf.json') as f:
              version = json.load(f)['version']

          with open('/tmp/sigs/Trade.Journal_aarch64.app.tar.gz.sig') as f:
              mac_sig = f.read().strip()

          with open('/tmp/sigs/windows.nsis.zip.sig') as f:
              win_sig = f.read().strip()

          tag = os.environ['GITHUB_REF_NAME']

          with open('CHANGELOG.md') as f:
              cl = f.read()
          m = re.search(r'## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)', cl, re.DOTALL)
          notes = m.group(1).strip() if m else 'Bug fixes and improvements.'

          data = {
              'version': version,
              'notes': notes,
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': {
                  'darwin-aarch64': {
                      'signature': mac_sig,
                      'url': f'https://github.com/ovuw/trade-journal/releases/download/{tag}/Trade.Journal_aarch64.app.tar.gz'
                  },
                  'windows-x86_64': {
                      'signature': win_sig,
                      'url': f'https://github.com/ovuw/trade-journal/releases/download/{tag}/Trade.Journal_{version}_x64-setup.nsis.zip'
                  }
              }
          }

          with open('latest.json', 'w') as f:
              json.dump(data, f, indent=2)

          print(json.dumps(data, indent=2))
          PYEOF

          gh release upload "${{ github.ref_name }}" latest.json --clobber

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" 2>/dev/null || \
          gh release create "${{ github.ref_name }}" \
            --title "Trade Journal ${{ github.ref_name }}" \
            --notes "Bug fixes and improvements."

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build

      - name: Upload macOS artifacts + latest.json
        if: matrix.os == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(node -e "const c=require('./src-tauri/tauri.conf.json');console.log(c.version)")
          BUNDLE_MACOS="src-tauri/target/release/bundle/macos"
          BUNDLE_DMG="src-tauri/target/release/bundle/dmg"

          # tauri build only produces .app and .dmg — create updater tar.gz + sign manually
          tar -czf "$BUNDLE_MACOS/Trade Journal.app.tar.gz" \
            -C "$BUNDLE_MACOS" "Trade Journal.app"
          npx tauri signer sign "$BUNDLE_MACOS/Trade Journal.app.tar.gz"

          # Copy to /tmp with no spaces in filenames (gh CLI chokes on spaces in globs)
          mkdir -p /tmp/release
          cp "$BUNDLE_DMG/Trade Journal_${VERSION}_aarch64.dmg" \
            "/tmp/release/Trade.Journal_${VERSION}_aarch64.dmg"
          cp "$BUNDLE_MACOS/Trade Journal.app.tar.gz" \
            "/tmp/release/Trade.Journal_aarch64.app.tar.gz"
          cp "$BUNDLE_MACOS/Trade Journal.app.tar.gz.sig" \
            "/tmp/release/Trade.Journal_aarch64.app.tar.gz.sig"

          gh release upload "$TAG" "/tmp/release/Trade.Journal_${VERSION}_aarch64.dmg" --clobber
          gh release upload "$TAG" "/tmp/release/Trade.Journal_aarch64.app.tar.gz" --clobber

          python3 << 'PYEOF'
          import json, os
          from datetime import datetime, timezone

          with open('src-tauri/tauri.conf.json') as f:
              version = json.load(f)['version']

          with open('/tmp/release/Trade.Journal_aarch64.app.tar.gz.sig') as f:
              sig = f.read().strip()

          tag = os.environ['GITHUB_REF_NAME']

          data = {
              'version': version,
              'notes': 'Bug fixes and improvements.',
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': {
                  'darwin-aarch64': {
                      'signature': sig,
                      'url': f'https://github.com/ovuw/trade-journal/releases/download/{tag}/Trade.Journal_aarch64.app.tar.gz'
                  }
              }
          }

          with open('latest.json', 'w') as f:
              json.dump(data, f, indent=2)

          print(json.dumps(data, indent=2))
          PYEOF

          gh release upload "$TAG" latest.json --clobber

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(node -e "const c=require('./src-tauri/tauri.conf.json');console.log(c.version)")

          mkdir -p /tmp/release
          cp "src-tauri/target/release/bundle/nsis/Trade Journal_${VERSION}_x64-setup.exe" \
            "/tmp/release/Trade.Journal_${VERSION}_x64-setup.exe"
          cp "src-tauri/target/release/bundle/msi/Trade Journal_${VERSION}_x64_en-US.msi" \
            "/tmp/release/Trade.Journal_${VERSION}_x64_en-US.msi"

          gh release upload "$TAG" "/tmp/release/Trade.Journal_${VERSION}_x64-setup.exe" --clobber
          gh release upload "$TAG" "/tmp/release/Trade.Journal_${VERSION}_x64_en-US.msi" --clobber
